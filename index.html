<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360° Posing Studio Pro</title>
    <style>
        :root { --bg: #090a0f; --card: #14161f; --accent: #3b82f6; --text: #ffffff; --text-muted: #8b949e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; font-size: 11px; }
        body, html { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; }
        .full-page-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; background: var(--bg); padding: 10px; gap: 10px; }
        .canvas-area { flex: 1; background: #000000; border: 1px solid #2d3139; border-radius: 8px; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        .controls-area { background: var(--card); border: 1px solid #2d3139; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-bottom: 1px solid #2d3139; padding-bottom: 8px; }
        .stat-item { text-align: center; }
        .label { color: var(--text-muted); font-size: 9px; text-transform: uppercase; margin-bottom: 2px; }
        .val { font-weight: bold; color: #ffffff; }
        .val.active { color: #10b981; }
        .interactive-grid { display: flex; flex-direction: column; gap: 8px; }
        .slider-box { display: flex; flex-direction: column; gap: 4px; }
        .slider-meta { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 10px; }
        .slider-meta span:last-child { color: var(--accent); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: #21262d; height: 4px; border-radius: 2px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }
        .upload-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .upload-btn { background: #21262d; border: 1px dashed #3b82f6; color: #ffffff; padding: 6px; border-radius: 4px; text-align: center; cursor: pointer; font-size: 10px; display: block; }
        .upload-btn input { display: none; }
        .title-bar { font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; border-bottom: 1px solid #2d3139; padding-bottom: 4px; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="full-page-container">
    <div class="canvas-area">
        <canvas id="studioEngine"></canvas>
    </div>
    <div class="controls-area">
        <div class="title-bar">
            <span>AREENA AI - POSING STUDIO ENGINE v2.0</span>
            <span style="color: #10b981;">● LIVE</span>
        </div>
        <div class="stats-row">
            <div class="stat-item"><div class="label">Sequence</div><div id="seqTxt" class="val">Front-Walk</div></div>
            <div class="stat-item"><div class="label">Cycle Phase</div><div id="phaseTxt" class="val">0%</div></div>
            <div class="stat-item"><div class="label">Symmetry</div><div class="val active">🔄 Locked</div></div>
        </div>
        <div class="interactive-grid">
            <div class="slider-box">
                <div class="slider-meta"><span>Walk Stride Speed</span><span id="speedVal">1.5x</span></div>
                <input type="range" id="speedSl" min="5" max="30" value="15">
            </div>
            <div class="slider-box">
                <div class="slider-meta"><span>Auto Turntable Rate</span><span id="rotateVal">1.2x</span></div>
                <input type="range" id="rotateSl" min="0" max="30" value="12">
            </div>
            <div class="upload-row">
                <label class="upload-btn">👤 TORSO PNG<input type="file" onchange="rigImg('torso', event)"></label>
                <label class="upload-btn">👦 HEAD PNG<input type="file" onchange="rigImg('head', event)"></label>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('studioEngine');
    const ctx = canvas.getContext('2d');
    const speedSl = document.getElementById('speedSl');
    const rotateSl = document.getElementById('rotateSl');

    let walkTime = 0;
    let angleTime = 0;
    let layers = { torso: null, head: null };

    function rigImg(part, e) {
        if (e.target.files && e.target.files) {
            const reader = new FileReader();
            reader.onload = (event) => {
                layers[part] = new Image();
                layers[part].src = event.target.result;
            };
            reader.readAsDataURL(e.target.files);
        }
    }

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let spd = speedSl.value / 10;
        let rot = rotateSl.value / 10;
        
        document.getElementById('speedVal').innerText = spd.toFixed(1) + "x";
        document.getElementById('rotateVal').innerText = rot.toFixed(1) + "x";

        walkTime += (0.05 * spd);
        angleTime += (0.012 * rot);

        let radians = angleTime % (Math.PI * 2);
        let phase = Math.floor((radians / (Math.PI * 2)) * 100);
        document.getElementById('phaseTxt').innerText = phase + "%";
        document.getElementById('seqTxt').innerText = Math.cos(radians) > 0 ? "Facing Front" : "Facing Back";

        let cx = canvas.width / 2;
        let cy = canvas.height * 0.45;
        let swing = Math.sin(walkTime);
        let bob = Math.abs(Math.sin(walkTime * 2)) * 5;

        let cosA = Math.cos(radians);
        let sinA = Math.sin(radians);

        ctx.beginPath(); ctx.ellipse(cx, cy + 120, 45, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();

        let leftX = cx - (24 * cosA) + (swing * 18 * sinA);
        let rightX = cx + (24 * cosA) - (swing * 18 * sinA);
        let leftY = cy + 95 + (swing * 18 * cosA);
        let rightY = cy + 95 - (swing * 18 * cosA);

        ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.strokeStyle = swing > 0 ? '#1d4ed8' : '#1e3a8a';
        ctx.beginPath(); ctx.moveTo(cx - (18 * cosA), cy + 45 + bob); ctx.lineTo(leftX, leftY); ctx.stroke();

        ctx.strokeStyle = swing < 0 ? '#1d4ed8' : '#1e3a8a';
        ctx.beginPath(); ctx.moveTo(cx + (18 * cosA), cy + 45 + bob); ctx.lineTo(rightX, rightY); ctx.stroke();

        if (layers.torso) {
            ctx.save(); ctx.translate(cx, cy + bob + 12);
            let tW = 80 * Math.max(0.4, Math.abs(cosA)) + 45 * Math.abs(sinA);
            ctx.drawImage(layers.torso, -tW/2, -35, tW, 95); ctx.restore();
        } else {
            ctx.fillStyle = '#2563eb'; ctx.save(); ctx.translate(cx, cy + bob + 10);
            let defW = 50 * Math.max(0.4, Math.abs(cosA)) + 32 * Math.abs(sinA);
            ctx.fillRect(-defW/2, -30, defW, 70); ctx.restore();
        }

        if (layers.head) {
            ctx.drawImage(layers.head, cx - 26, cy - 65 + bob, 52, 55);
        } else {
            ctx.fillStyle = '#60a5fa'; ctx.beginPath(); ctx.arc(cx, cy - 35 + bob, 16, 0, Math.PI * 2); ctx.fill();
        }

        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>
