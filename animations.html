<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<title>Characters · Animations</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0f1113;color:#e8e8ec;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

  /* ---------- top bar ---------- */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(15,17,19,.94);
    backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
  .ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#cfd3d8;cursor:pointer}
  .ic:active{background:rgba(255,255,255,.12)}
  .ic svg{width:17px;height:17px}
  .top h1{flex:1;font-size:21px;font-weight:800;letter-spacing:-.4px;margin:0}
  .top .right{display:flex;gap:8px}

  /* ---------- selected character row ---------- */
  .wrap{padding:14px}
  .selRow{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:12px 14px}
  .selRow .thumb{width:52px;height:64px;flex:0 0 52px;border-radius:10px;background:rgba(255,255,255,.05);
    display:grid;place-items:center;overflow:hidden}
  .selRow .thumb img{width:100%;height:100%;object-fit:contain}
  .selRow .nm{flex:1;min-width:0}
  .selRow .nm b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selRow .nm small{display:block;font-size:10.5px;color:#8b929b;margin-top:3px;letter-spacing:.4px}
  .badgeSel{font-size:11.5px;font-weight:800;padding:7px 13px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,#7c5cff,#ff6ba8);box-shadow:0 6px 18px -8px rgba(124,92,255,.9)}

  /* ---------- search ---------- */
  .search{display:flex;align-items:center;gap:10px;margin:14px 0 12px;padding:13px 15px;border-radius:14px;
    background:#181b1f;border:1px solid rgba(255,255,255,.09);color:#8b929b;font-size:14px}
  .search svg{width:17px;height:17px;flex:0 0 17px}
  .search input{flex:1;background:transparent;border:0;outline:0;color:#e8e8ec;font:inherit;font-size:14px}
  .search input::placeholder{color:#7c848d}

  /* ---------- view tabs ---------- */
  .tabs{display:flex;gap:9px;margin-bottom:16px}
  .tab{flex:0 0 auto;padding:11px 17px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.7px;
    background:#181b1f;border:1px solid rgba(255,255,255,.09);color:#a9b1ba;cursor:pointer}
  .tab.on{background:#f2f3f5;border-color:#f2f3f5;color:#111316}
  .tab:active{transform:scale(.97)}

  /* ---------- animation grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;border-radius:16px;background:#181b1f;border:1px solid rgba(255,255,255,.08);
    padding:10px 12px 12px;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s}
  .tile:active{transform:scale(.985)}
  .tile.on{border-color:#4d8dff;box-shadow:0 0 0 1px #4d8dff,0 12px 30px -18px rgba(77,141,255,.9)}
  .tile .art{height:150px;display:grid;place-items:center}
  .tile .art svg{height:100%;width:auto}
  .tile .lb{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12.5px;font-weight:700;color:#dfe3e8;letter-spacing:-.1px}
  .tile .lb .pill{font-size:8.5px;font-weight:800;letter-spacing:.8px;padding:4px 7px;border-radius:999px;
    color:#9aa3ad;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
  .tile.on .lb .pill{color:#9fc4ff;border-color:rgba(77,141,255,.45);background:rgba(77,141,255,.14)}

  /* ---------- per-card Upload (v1) ---------- */
  .tile .up{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:6px 9px 6px 7px;
    border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);
    color:#cfd3d8;font:800 10px/1 inherit;letter-spacing:.4px;cursor:pointer;
    white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .tile .up svg{width:12px;height:12px;flex:0 0 12px}
  .tile .up:active{background:rgba(255,255,255,.15)}
  .tile .btnrow{display:flex;flex-wrap:wrap;gap:5px}
  .top .stBtn{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:6px;
    font-size:10.5px;font-weight:700;color:#dbeafe;background:rgba(255,255,255,.06);
    border:1px solid rgba(140,180,255,.35);cursor:pointer;white-space:nowrap}
  .top .stBtn:active{background:rgba(255,255,255,.14)}
  .grid{padding-bottom:70px}
  .tile .up.studio{color:#cfe4ff;border-color:rgba(140,180,255,.35);background:rgba(90,140,255,.12)}
  .tile .up.studio.done{color:#8af2b4;border-color:rgba(34,224,125,.42);background:rgba(34,224,125,.13)}
  .tile .up.done{color:#8af2b4;border-color:rgba(34,224,125,.42);background:rgba(34,224,125,.13)}
  .tile .art img{display:block;width:100%;height:150px;object-fit:contain;border-radius:8px}
  .tile .art video{display:block;width:100%;height:150px;object-fit:contain;border-radius:8px;background:transparent}
  .tile .art{position:relative}
  .tile .art canvas{display:block;height:150px;width:auto;max-width:100%;border-radius:8px}
  .tile .art .kvSrc{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
  .tile .lb .pill.vid{color:#ffd166;border-color:rgba(255,209,102,.45);background:rgba(255,209,102,.12)}
  .tile .okChip{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:999px;
    display:grid;place-items:center;background:rgba(34,224,125,.18);border:1px solid rgba(34,224,125,.5);
    color:#7bf0ae;cursor:pointer}
  .tile .okChip svg{width:11px;height:11px}
  .empty{grid-column:1/-1;text-align:center;color:#7c848d;font-size:13px;padding:30px 10px}

  /* ---------- sticky CTA ---------- */
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(15,17,19,.35),rgba(15,17,19,.97) 42%)}
  .cta button{width:100%;padding:17px;border:0;border-radius:16px;font:800 15px/1 inherit;font-family:inherit;
    color:#fff;background:linear-gradient(135deg,#3b82f6,#2f6df6);letter-spacing:.2px;cursor:pointer;
    box-shadow:0 16px 34px -16px rgba(59,130,246,.95)}
  .cta button:disabled{color:#8f97a1;background:#242a31;box-shadow:none;cursor:not-allowed}
  .cta button:not(:disabled):active{transform:translateY(1px)}

  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:#22282f;border:1px solid rgba(255,255,255,.12);color:#e8e8ec;font-size:12.5px;font-weight:700;
    padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:40}
  .toast.show{opacity:1;transform:translate(-50%,0)}

/* Order 59 — AutoDraft ke card jaisa hi size/style (chhota square, 2 column) */
.putlaWrap{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:8px 0 24px; }
.putlaCard{ background:#101114; border:1px solid #1e2126; border-radius:12px; padding:9px 9px 7px;
  display:flex; flex-direction:column; gap:6px; aspect-ratio:1 / 1.06; overflow:hidden; }
.putlaCard:active{ border-color:#f2f2f5; }
.putlaCard .putlaArt{ flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
.putlaCard .putlaArt img{ max-width:100%; max-height:100%; object-fit:contain; }
  /* R108 · chalta hua putla — sprite sheet (12 frames, horizontal strip) */
  /* R109 · safed putla (AutoDraft jaisa) — canvas par seedha draw hota hai */
  .putlaArt .spriteCv{ display:block; max-width:100%; max-height:100%; }
  .putlaLiveBadge{ position:absolute; top:8px; right:8px; font-size:9px; font-weight:800; letter-spacing:.5px;
    padding:3px 7px; border-radius:999px; background:rgba(124,92,255,.9); color:#fff; }
.putlaCard .putlaLbl{ align-self:flex-start; font-size:10px; line-height:1; color:#c6ccd3; }

/* Order 58 — chips aur Action Studio ek doosre par chadh rahe the */
.tabsRow{ display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.tabsRow::-webkit-scrollbar{ display:none; }
.tabs{ display:flex; gap:6px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs .tab{ font-size:9.5px !important; padding:5px 8px !important; letter-spacing:.02em; }
.stBtn{ font-size:10px !important; padding:5px 9px !important; margin-left:0; flex:0 0 auto; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs .tab{ flex:0 0 auto; }
.stBtn{ flex:0 0 auto; white-space:nowrap; }
@media (max-width:380px){ .tabsRow{ flex-wrap:wrap; } .stBtn{ margin-left:auto; } }

.letterAv{ display:flex; align-items:center; justify-content:center; width:100%; height:100%;
  font:800 22px/1 Inter,system-ui,sans-serif; color:#cfd6de; background:#20242a; border-radius:10px; }
.selRow .badgeSel{ padding:6px 12px !important; border-radius:8px !important; font-size:11px !important; font-weight:700 !important;
  color:#fff !important; background:linear-gradient(90deg,#7c5cff,#b06cff) !important; border:0 !important; }
.selRow .backIn{ background:transparent !important; border:0 !important; color:#e6e9ee !important; padding:0 !important; }
/* Order 59 — chips AutoDraft jaisa: gol pill, active = safed */
.tabs .tab{ border-radius:999px !important; background:#1b1e22 !important; border:1px solid #2a2e34 !important;
  color:#cfd5dd !important; font-weight:700 !important; letter-spacing:.02em; }
.tabs .tab.on{ background:#f4f5f7 !important; border-color:#f4f5f7 !important; color:#101114 !important; }
</style>

<style id="smMobile">
/* ============================================================
   skin-mobile.css — GLOBAL MOBILE COMPACT PASS (v1)
   Har site page par inject hota hai (<style id="smMobile">).
   Maqsad: mobile par UI ka scale chhota, sab kuch screen ke andar,
   koi horizontal overflow nahi, canvas 16:9 hi rahe.
   Features/layout structure ko chheda nahi gaya — sirf sizes.
   ============================================================ */

/* ---------- 0. base guard (har page) ---------- */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
html,body{ max-width:100%; overflow-x:hidden; }
*,*::before,*::after{ box-sizing:border-box; }
img,canvas,video,svg{ max-width:100%; }
button,input,select,textarea{ font-family:inherit; }

/* ---------- 1. EDITOR (hilao.html) ---------- */
/* topbar — AutoDraft scale (48px, 16px icons, 10px labels, separators) */
.topbar{
  height:48px !important; padding:0 4px !important;
  border-bottom:1px solid rgba(255,255,255,.10) !important;
}
.top-action{
  min-width:56px !important; font-size:10px !important; padding:4px 8px !important; gap:3px !important;
  border-left:1px solid rgba(255,255,255,.07) !important; border-radius:0 !important;
}
.top-action:last-of-type{ border-right:1px solid rgba(255,255,255,.07) !important; }
.top-action .icon{ width:16px !important; height:16px !important; }
.top-action[on], .top-action.on, .top-action:active{ background:rgba(255,255,255,.10) !important; }
.top-left{ gap:2px !important; }
.top-left .icon-btn{ width:32px !important; height:32px !important; }
.topbar .icon-btn .icon, .topbar .icon{ width:16px !important; height:16px !important; }

/* playbar */
.playbar{ height:32px !important; padding:0 6px !important; gap:4px !important; }
.playbar .icon-btn{ width:20px !important; height:20px !important; }
.playbar .icon{ width:13px !important; height:13px !important; }
.play-round{ width:24px !important; height:24px !important; }
.play-round .icon{ width:14px !important; height:14px !important; }
.speed-btn{ font-size:9.5px !important; padding:2px 6px !important; min-width:26px !important; }
.timecode{ font-size:9.5px !important; }

/* quick tools row */
.quick-tools{ height:32px !important; padding:0 5px !important; gap:3px !important; }
.quick-left,.quick-right{ gap:3px !important; }
.quick-tools .icon-btn{ width:21px !important; height:21px !important; }
.quick-tools .icon{ width:13px !important; height:13px !important; }

#smPathQuick svg{ width:12px !important; height:12px !important; }

.scene-chip .icon{ width:12px !important; height:12px !important; }
.box-btn{ width:22px !important; height:22px !important; }
.box-btn .icon{ width:13px !important; height:13px !important; }
.scenebar .icon-btn{ width:22px !important; height:22px !important; }
.scenebar .icon{ width:14px !important; height:14px !important; }

/* stage / canvas — 16:9, thodi jagah timeline ko */
.preview-shell{ padding:3px !important; }
.stage{ max-height:40vh !important; }

  height:auto !important; flex:1 1 auto !important;
  min-height:148px !important; max-height:min(330px,42dvh) !important;
  padding-top:12px !important;
}

<script>
(function () {
  "use strict";

  /* ---------- query params (Hilao Studio se aata hai) ---------- */
  var q = new URLSearchParams(location.search);
  var charName = (q.get('name') || 'My character').trim();
  var charImg  = q.get('img') || '';
  if (!charImg) { try { charImg = localStorage.getItem('hilao.charImg') || ''; } catch (e) {} }
  var charId   = q.get('id') || '';
  document.getElementById('selName').textContent = charName;
  document.getElementById('selMeta').textContent = 'Selected · ' + (q.get('cat') || 'Desi');
  document.title = charName + ' · Animations';
  if (charImg) {
    var im = new Image(); im.alt = charName; im.src = charImg;
    document.getElementById('selThumb').appendChild(im);
  } else {
    document.getElementById('selThumb').innerHTML =
      '<span class="letterAv">' + (charName || 'C').trim().charAt(0).toUpperCase() + '</span>';
  }

  /* ---------- puppet silhouette generator ----------
     Har animation = limb angles ka set. Ek hi generator se saare
     tiles bante hain, isliye look consistent rehta hai.            */
  function seg(x1, y1, len, ang, w, col) {
    var rad = ang * Math.PI / 180;
    var x2 = x1 + Math.sin(rad) * len, y2 = y1 + Math.cos(rad) * len;
    return {
      svg: '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
           '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>',
      x: x2, y: y2
    };
  }
  /* limb with optional knee/elbow bend (2 segments) */
  function limb(x1, y1, len, ang, w, col, bend) {
    var a = seg(x1, y1, len * (bend === undefined ? 1 : 0.52), ang, w, col);
    if (bend === undefined) return a.svg;
    var b = seg(a.x, a.y, len * 0.52, ang + bend, w, col);
    return a.svg + b.svg;
  }

  /* ---------- puppet ----------
     Sar / gardan / torso / kandhe / koolhe — sab anatomical anchors par. */
  function puppet(p, view, size) {
    var col = '#f3f4f6';
    var skew = view === 'q34f' ? 'skewY(-5) scale(0.88,1)'
             : view === 'q34b' ? 'skewY(5) scale(0.88,1)' : '';
    var g = '<g' + (skew ? ' transform="' + skew + '"' : '') + '>';

    var armA  = p.armA === undefined ? 9 : p.armA;
    var armB  = p.armB === undefined ? -armA : p.armB;
    var legA  = p.legA === undefined ? (p.legs || 4) : p.legA;
    var legB  = p.legB === undefined ? -legA : p.legB;
    var bob   = p.bob || 0;             /* jump / lift */
    var kneeA = p.kneeA, kneeB = p.kneeB;

    /* LEGS (koolha 92 / 108, y 110) */
    g += limb(92, 110, 54, legA, 11, col, kneeA);
    g += limb(108, 110, 54, legB, 11, col, kneeB);

    /* ARMS (kandha 83 / 117, y 60) */
    g += limb(80, 60, 48, armA, 9.5, col, p.elbowA);
    g += limb(120, 60, 48, armB, 9.5, col, p.elbowB);

    /* TORSO */
    g += '<path d="M83 54 q17 -8 34 0 l0 50 q-17 8 -34 0 z" fill="' + col + '"/>';
    /* NECK + HEAD */
    g += '<rect x="95" y="42" width="10" height="12" rx="4" fill="' + col + '"/>';
    g += '<circle cx="100" cy="30" r="17" fill="' + col + '"/>';
    g += '</g>';
    return '<svg viewBox="0 0 200 200" style="height:' + (size || 150) + 'px' +
           (bob ? ';transform:translateY(' + bob + 'px)' : '') + '" aria-hidden="true">' + g + '</svg>';
  }

  var ICO_STUDIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M9 20V5"/><path d="M14 20v-8"/><path d="M19 20V8"/></svg>';

  var ANIMS = [
    /* built-in VIDEO action (AI frames se bana, repo me anim/chai-animation.mp4) */
    { id: 'chai',    name: 'Chai Action',
      video: 'anim/chai-animation.webm', video2: 'anim/chai-animation.mp4' },
    { id: 'idle',    name: 'Idle',     pose: { armA: 12, armB: -12,  legA: 4 } },
    { id: 'walk',    name: 'Walk',     pose: { armA: 26, armB: -26, legA: 17, kneeA: 12 } },
    { id: 'talking', name: 'Talking',  pose: { armA: 62, armB: -12, elbowA: -48, legA: 4 } },
    { id: 'sitting', name: 'Sitting',  pose: { armA: 16, armB: -16, legA: 78, legB: -70, kneeA: -72, kneeB: 72 } },
    { id: 'wave',    name: 'Wave',     pose: { armA: 158, armB: -12, elbowA: -20, legA: 4 } },
    { id: 'run',     name: 'Run',      pose: { armA: 52, armB: -52, legA: 34, kneeA: 26, kneeB: -22 } },
    { id: 'jump',    name: 'Jump',     pose: { armA: 152, armB: -152, legA: 20, legB: -20, kneeA: 24, kneeB: -24, bob: -6 } },
    { id: 'dance',   name: 'Dance',    pose: { armA: 108, armB: -44, elbowA: -30, legA: 22, kneeA: 14 } },
    { id: 'point',   name: 'Point',    pose: { armA: 88, armB: -8, legA: 4 } },
    { id: 'think',   name: 'Think',    pose: { armA: 44, armB: -10, elbowA: -76, legA: 3 } },
    { id: 'sit_floor',name: 'Sit Down',pose: { armA: 30, armB: -30, legA: 84, legB: -84, kneeA: -66, kneeB: 66 } },
    { id: 'explain', name: 'Explain',  pose: { armA: 70, armB: -34, elbowA: -40, elbowB: 18, legA: 10 } }
  ];


  /* ---------- per-card UPLOAD (gallery se image) ----------
     Idle aur Walk cards par chhota Upload button. Tap -> gallery/file picker khulta hai,
     image chhoti (max 480px) karke localStorage me save hoti hai aur card ka artwork
     ban jaati hai. Tap-only, dummy nahi: image turant card me dikhti hai + reload par bhi rehti hai. */
  var UPLOADABLE = { idle: 1, walk: 1 };

  /* ---------- Action Studio wiring (puppet → real animation) ----------
     Har tile par "Animate" — us action ke liye puppet upload karke skeletal
     animation banegi (actionanim.html). */
  var charTex = '';
  function loadCharTex() {
    try {
      var r = indexedDB.open('hilao-pose', 1);
      r.onupgradeneeded = function () { try { r.result.createObjectStore('blobs'); } catch (e) {} };
      r.onsuccess = function () {
        var db = r.result;
        if (!db.objectStoreNames.contains('blobs')) return;
        var q2 = db.transaction('blobs', 'readonly').objectStore('blobs').get('char.tex');
        q2.onsuccess = function () {
          var rec = q2.result;
          var src = rec && (typeof rec === 'string' ? rec : rec.src);
          if (src) { charTex = src; renderAndMount(); }
        };
      };
    } catch (e) {}
  }

  var STUDIO_MAP = { idle:'idle', walk:'walk', run:'run', talking:'talking', sitting:'sitting',
                     wave:'waving', jump:'jumping', dance:'dancing', sit_floor:'sitting',
                     point:'waving', think:'talking', explain:'talking', chai:'idle' };
  var studioDone = {};
  function studioUrl(action) {
    return 'actionanim.html?action=' + encodeURIComponent(action) +
      '&name=' + encodeURIComponent(charName) + '&id=' + encodeURIComponent(charId || '');
  }
  function loadStudioDone() {
    try {
      var r = indexedDB.open('actionanim', 1);
      r.onupgradeneeded = function () { try { r.result.createObjectStore('animations'); } catch (e) {} };
      r.onsuccess = function () {
        var db = r.result;
        if (!db.objectStoreNames.contains('animations')) return;
        var q2 = db.transaction('animations', 'readonly').objectStore('animations').getAll();
        q2.onsuccess = function () {
          var any = false;
          (q2.result || []).forEach(function (rec) { if (rec && rec.action) { studioDone[rec.action] = 1; any = true; } });
          if (any) renderAndMount();
        };
      };
    } catch (e) {}
  }
  var poseImg = {};
  try {
    Object.keys(UPLOADABLE).forEach(function (k) {
      var v = localStorage.getItem('hilao.pose.' + k);
      if (v) poseImg[k] = { kind: 'image', src: v };
    });
  } catch (e) {}
  var pendingAnim = null;
  var poseFile = document.getElementById('poseFile');

  /* ---------- IndexedDB (video blobs ke liye — localStorage me video fit nahi hoti) ---------- */
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('hilao-pose', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('blobs'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbPut(k, v) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('blobs', 'readwrite');
        t.objectStore('blobs').put(v, k);
        t.oncomplete = function () { res(1); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function idbGet(k) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('blobs', 'readonly'), rq = t.objectStore('blobs').get(k);
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function idbDel(k) {
    return idb().then(function (db) {
      return new Promise(function (res) {
        var t = db.transaction('blobs', 'readwrite');
        t.objectStore('blobs').delete(k);
        t.oncomplete = function () { res(1); };
      });
    });
  }
  /* page khulte hi saved videos wapas laao */
  (function restoreVideos() {
    Object.keys(UPLOADABLE).forEach(function (k) {
      idbGet('vid.' + k).then(function (blob) {
        if (blob) { poseImg[k] = { kind: 'video', src: URL.createObjectURL(blob) }; renderAndMount(); }
      }).catch(function () {});
    });
  })();

  var ICO_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
               '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>';
  var ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  /* =====================================================================
     CHROMA KEY PLAYER (v1) — green/any-flat bg wali video ko card me
     transparent dikhata hai. Sab client-side: <video> -> canvas -> alpha.
     Border ring se bg colour nikalta hai; agar bg uniform nahi (busy photo)
     to key nahi karta aur normal video chala deta hai.
     ===================================================================== */
  var players = [];
  function stopPlayers() { players.forEach(function (f) { try { f(); } catch (e) {} }); players = []; }

  function startKey(host, video, reg) {
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d', { willReadFrequently: true });
    var off = document.createElement('canvas');
    var octx = off.getContext('2d', { willReadFrequently: true });
    var key = null, T = 45, keyed = false, raf = 0, dead = false, fps = 0;

    video.classList.add('kvSrc');
    host.appendChild(cv);

    function sampleBorder() {
      var vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return false;
      off.width = 48; off.height = Math.max(2, Math.round(48 * vh / vw));
      octx.drawImage(video, 0, 0, off.width, off.height);
      var d = octx.getImageData(0, 0, off.width, off.height).data;
      var n = 0, sr = 0, sg = 0, sb = 0, y, x, i;
      for (y = 0; y < off.height; y++) for (x = 0; x < off.width; x++) {
        if (y > 1 && y < off.height - 2 && x > 1 && x < off.width - 2) continue;
        i = (y * off.width + x) * 4;
        sr += d[i]; sg += d[i + 1]; sb += d[i + 2]; n++;
      }
      if (!n) return false;
      var kr = sr / n, kg = sg / n, kb = sb / n;
      var err = 0;
      for (y = 0; y < off.height; y++) for (x = 0; x < off.width; x++) {
        if (y > 1 && y < off.height - 2 && x > 1 && x < off.width - 2) continue;
        i = (y * off.width + x) * 4;
        err += Math.abs(d[i] - kr) + Math.abs(d[i + 1] - kg) + Math.abs(d[i + 2] - kb);
      }
      err = err / n;
      key = [kr, kg, kb];
      T = Math.max(45, Math.min(120, err * 1.5 + 35));
      /* uniform border (err chhota) ho tabhi key karo */
      keyed = err < 95;
      return true;
    }

    function draw() {
      var vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;
      var w = Math.min(200, Math.max(120, Math.round(host.clientWidth || 150)));
      var h = Math.max(2, Math.round(w * vh / vw));
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(video, 0, 0, w, h);
      if (!keyed) return;
      var img = ctx.getImageData(0, 0, w, h), d = img.data;
      var kr = key[0], kg = key[1], kb = key[2], t1 = T, t2 = T * 1.45;
      var greenKey = (kg > kr + 25 && kg > kb + 25);      /* green screen? -> spill suppression */
      for (var i = 0; i < d.length; i += 4) {
        var dm = Math.abs(d[i] - kr) + Math.abs(d[i + 1] - kg) + Math.abs(d[i + 2] - kb);
        if (dm <= t1) { d[i + 3] = 0; continue; }
        if (dm < t2) d[i + 3] = Math.round(d[i + 3] * (dm - t1) / (t2 - t1));
        /* kinare par hari chamak (spill) hatao */
        if (greenKey && dm < t2 * 2.4) {
          var mx = (d[i] > d[i + 2] ? d[i] : d[i + 2]) + 6;
          if (d[i + 1] > mx) d[i + 1] = mx;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    function tick() {
      if (dead) return;
      if (video.readyState >= 2) {
        if (!key && !sampleBorder()) { raf = requestAnimationFrame(tick); return; }
        draw();
      }
      raf = requestAnimationFrame(tick);
    }

    /* autoplay block ho jaye to pehle tap par chalao */
    var p = video.play && video.play();
    if (p && p.catch) p.catch(function () {});

    raf = requestAnimationFrame(tick);
    reg(function () { dead = true; cancelAnimationFrame(raf); });
  }

  function mountMedia() {
    stopPlayers();
    [].forEach.call((grid || document).querySelectorAll('.art'), function (host) {
      var v = host.querySelector('video');
      if (!v) return;
      if (host.getAttribute('data-key') !== '1') return;   /* built-in clip: key ki zarurat nahi */
      startKey(host, v, function (stop) { players.push(stop); });
    });
  }

  /* =====================================================================
     v2 · SELECTION -> localStorage -> Editor
     Tap par: (1) asset source (image/gif/video/silhouette) + character id
     localStorage['hilao.sel'] me, (2) turant editor (hilao.html) par redirect.
     ===================================================================== */
  function svgDataUrl(svg) {
    /* editor me <img> ki tarah load hota hai — intrinsic size chahiye,
       warna naturalWidth 0 rehta hai aur kuch draw nahi hota */
    try {
      var clean = String(svg)
        .replace(/\sstyle="[^"]*"/, '')                       /* height:150px hatao */
        .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" ');
      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(clean)));
    } catch (e) { return ''; }
  }

  /* us card ka asli asset nikaalo (jo bhi user ne upload kiya ho, warna built-in) */
  function assetFor(a) {
    var pv = poseImg[a.id];
    if (pv && pv.kind === 'image') return { kind: 'data', src: pv.src };
    if (pv && (pv.kind === 'video' || pv.kind === 'gif')) return { kind: 'idb', key: 'vid.' + a.id, type: pv.kind };
    if (a.video) return { kind: 'url', src: a.video };
    /* v3 · white silhouette placeholder BAND — jo character chuna hai
       (Characters panel / hilao.html) uski asli PNG texture editor me jayegi. */
    var cid = '';
    try { cid = localStorage.getItem('hilao.charId') || ''; } catch (e) {}
    return { kind: 'idbchar', key: 'char.tex', charId: cid || charId || '' };
  }

  function saveSelection(a) {
    var payload = {
      v: 2,
      anim: a.id,
      name: a.name,
      char: charId || '',
      charName: charName,
      view: view,
      key: true,                    /* editor me chroma key lagao */
      flip: false,                  /* mirror: editor me __smBgAnim.flip() */
      media: assetFor(a),
      ts: Date.now()
    };
    try {
      localStorage.setItem('hilao.sel', JSON.stringify(payload));
      localStorage.setItem('hilao.anim', a.id);          /* purane pages ke liye */
      localStorage.setItem('hilao.char', charName);
    } catch (e) {}
    return payload;
  }

  function goEditor(a) {
    var payload = saveSelection(a);
    showToast((a.name || a.id) + ' select · editor khol raha hai');
    var url = 'hilao.html?anim=' + encodeURIComponent(payload.anim) +
              (payload.char ? '&char=' + encodeURIComponent(payload.char) : '') +
              '&view=' + encodeURIComponent(payload.view);
    setTimeout(function () { location.href = url; }, 260);
  }

  function openPicker(anim) {
    pendingAnim = anim;
    try { poseFile.value = ''; } catch (e) {}
    poseFile.click();
  }

  /* gallery image -> max 480px -> dataURL (storage bachane ke liye) */
  function shrink(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var MAX = 480;
        var k = Math.min(1, MAX / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.imageSmoothingQuality = 'high';
        cx.drawImage(im, 0, 0, w, h);
        var out = '';
        try { out = cv.toDataURL('image/webp', 0.85); } catch (e) {}
        if (!out || out.indexOf('data:image/webp') !== 0) {
          try { out = cv.toDataURL('image/png'); } catch (e) { out = ''; }
        }
        cb(out || '');
      };
      im.onerror = function () { cb(''); };
      im.src = fr.result;
    };
    fr.onerror = function () { cb(''); };
    fr.readAsDataURL(file);
  }

  poseFile.addEventListener('change', function () {
    var f = poseFile.files && poseFile.files[0];
    if (!f || !pendingAnim) return;
    var anim = pendingAnim; pendingAnim = null;
    var nm = (ANIMS.filter(function (x) { return x.id === anim; })[0] || {}).name || anim;

    /* GIF / APNG: original blob hi rakho (canvas se shrink kiya to animation mar jaati hai) */
    if (f.type === 'image/gif' || f.type === 'image/apng') {
      idbPut('vid.' + anim, f).then(function () {
        poseImg[anim] = { kind: 'gif', src: URL.createObjectURL(f) };
        try { localStorage.removeItem('hilao.pose.' + anim); } catch (e) {}
        renderAndMount();
        showToast(nm + ' ' + (f.type === 'image/gif' ? 'GIF' : 'APNG') + ' set · loop chalega');
      }).catch(function () { showToast('GIF save nahi hui — dobara try karo'); });
      return;
    }

    /* VIDEO: seedha blob IDB me (localStorage me nahi) */
    if ((f.type || '').indexOf('video') === 0) {
      if (f.size > 24 * 1024 * 1024) { showToast('Video 24 MB se badi hai — chhoti clip lo'); return; }
      idbPut('vid.' + anim, f).then(function () {
        poseImg[anim] = { kind: 'video', src: URL.createObjectURL(f) };
        try { localStorage.removeItem('hilao.pose.' + anim); } catch (e) {}
        renderAndMount();
        showToast(nm + ' video set · gallery se aa gayi');
      }).catch(function () { showToast('Video save nahi hui — dobara try karo'); });
      return;
    }

    shrink(f, function (data) {
      if (!data) { showToast('Image padhi nahi ja saki — doosri try karo'); return; }
      idbDel('vid.' + anim).catch(function () {});
      poseImg[anim] = { kind: 'image', src: data };
      try { localStorage.setItem('hilao.pose.' + anim, data); } catch (e) {}
      renderAndMount();
      var a = ANIMS.filter(function (x) { return x.id === anim; })[0];
      showToast((a ? a.name : anim) + ' image set · gallery se aa gayi');
    });
  });

  var view = 'front';
  var picked = null;
  var putlaWrap = document.getElementById('putlaWrap');
  var grid = putlaWrap;   /* purane handlers isi par lage the */
  var useBtn = document.getElementById('btnUse');
  var toast = document.getElementById('toast');
  var search = document.getElementById('animSearch');

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 1400);
  }

  /* Order 58 (user: "putlo wala page, sirf ek hi putla") — ek hi putla,
     AutoDraft "My character" jaisa. Putle par tap = character background par
     (editor khul jata hai). Purane 13 action cards hate hue hain. */
  function render() {
    var term = (search.value || '').toLowerCase().trim();
    var label = charName || 'My character';
    if (term && label.toLowerCase().indexOf(term) < 0 && 'idle'.indexOf(term) < 0) {
      putlaWrap.innerHTML = '<div class="empty">Is naam ka putla nahi mila.</div>';
      return;
    }
    var tex = charImg || charTex;   /* selected character pehle, IDB ka purana tex baad me */
    /* R109 · user: "ye humko nahi chahiye, only 1 — Walk safed putla bilkul AutoDraft jaisa".
       Isliye card me hamesha ek SAFED PUTLA walk chalta hai (character ka photo nahi). */
    var art = '<canvas class="spriteCv" width="160" height="220" role="img" aria-label="walk animation"></canvas>';
    putlaWrap.innerHTML =
      '<button class="putlaCard" id="putlaTap" type="button" style="position:relative" aria-label="walk animation">' +
        '<span class="putlaLiveBadge">WALK</span>' +
        '<span class="putlaArt">' + art + '</span>' +
        '<span class="putlaLbl">Walk</span>' +
      '</button>';
    var tap = document.getElementById('putlaTap');
    if (tap) tap.onclick = pickPutla;
    if (useBtn) useBtn.disabled = true;
    startWhiteWalk();
  }

  /* ---------------------------------------------------------------
     R109 · SAFED PUTLA WALK (AutoDraft style)
     Simple white silhouette human — head, torso, do haath, do pair —
     canvas par procedurally draw hoti hai. Koi image, koi sprite, koi video nahi.
     --------------------------------------------------------------- */
  var wwRAF = null;
  function startWhiteWalk() {
    var cv = document.querySelector('#putlaWrap .spriteCv');
    if (!cv) return;
    if (wwRAF) { cancelAnimationFrame(wwRAF); wwRAF = null; }
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    var cx = W / 2, feetY = H - 16, headY = 34;
    var torsoTop = headY + 34, hipY = torsoTop + 62;
    var WHITE = '#f4f6f9', D2R = Math.PI / 180;

    function seg(x1, y1, x2, y2, w) {
      ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    function draw(t) {
      var a = t * 2 * Math.PI;
      var sw = Math.sin(a), sw2 = Math.sin(a + Math.PI);
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = WHITE; ctx.fillStyle = WHITE;

      /* pair (thigh + shin) — knee bend */
      var legs = [
        { hip: cx - 10, sw: sw, bend: Math.max(0, -Math.sin(a + 1.0)) },
        { hip: cx + 10, sw: sw2, bend: Math.max(0, -Math.sin(a + 1.0 + Math.PI)) }
      ];
      legs.forEach(function (L) {
        var hipP = { x: L.hip, y: hipY };
        var thA = L.sw * 12 * D2R, knA = L.bend * 22 * D2R;
        var knee = { x: hipP.x + Math.sin(thA) * 44, y: hipP.y + Math.cos(thA) * 44 };
        var shA = thA - knA;
        var foot = { x: knee.x + Math.sin(shA) * 44, y: knee.y + Math.cos(shA) * 44 };
        seg(hipP.x, hipP.y, knee.x, knee.y, 15);
        seg(knee.x, knee.y, foot.x, foot.y, 13);
        seg(foot.x - 5, foot.y, foot.x + 8, foot.y, 9);      /* panja */
      });

      /* torso + kandhe (thoda chauda, AutoDraft jaisa silhouette) */
      ctx.beginPath();
      ctx.lineWidth = 26; ctx.lineCap = 'round';
      ctx.moveTo(cx, torsoTop + 4); ctx.lineTo(cx, hipY);
      ctx.stroke();
      seg(cx - 15, torsoTop + 8, cx + 15, torsoTop + 8, 16);   /* shoulder bar */

      /* haath (pair ke ulte) */
      var arms = [
        { sh: cx - 15, sw: sw2, dir: -1 },
        { sh: cx + 15, sw: sw, dir: 1 }
      ];
      arms.forEach(function (A) {
        var shP = { x: A.sh, y: torsoTop + 6 };
        var uA = A.sw * 14 * D2R;
        var elbow = { x: shP.x + Math.sin(uA) * 32 + A.dir * 6, y: shP.y + Math.cos(uA) * 32 };
        var fA = uA + 10 * D2R;
        var hand = { x: elbow.x + Math.sin(fA) * 30, y: elbow.y + Math.cos(fA) * 30 };
        seg(shP.x, shP.y, elbow.x, elbow.y, 12);
        seg(elbow.x, elbow.y, hand.x, hand.y, 10);
      });

      /* sar + gardan */
      ctx.beginPath(); ctx.arc(cx, headY, 17, 0, 6.2832); ctx.fill();
      seg(cx, headY + 15, cx, torsoTop + 2, 12);
    }

    var t0 = performance.now();
    function frame(now) {
      if (!document.body.contains(cv)) { wwRAF = null; return; }
      draw((now - t0) / 1100);            /* ~0.9 walk cycle per second */
      wwRAF = requestAnimationFrame(frame);
    }
    wwRAF = requestAnimationFrame(frame);
  }

  /* R108c · putle ka chalta hua card — sprite sheet se frames draw karta hai */
  var spriteRAF = null, spriteImg = null, spriteSheet = null;
  function startSprite(spr) {
    var cv = document.querySelector('#putlaWrap .spriteCv');
    if (!cv) return;
    if (spriteRAF) { cancelAnimationFrame(spriteRAF); spriteRAF = null; }
    var img = new Image();
    img.onload = function () {
      var ctx = cv.getContext('2d');
      var n = spr.frames || 12, fw = spr.w || 150, fh = spr.h || 200;
      var t0 = performance.now();
      function frame(now) {
        if (!document.body.contains(cv)) { spriteRAF = null; return; }
        var idx = Math.floor(((now - t0) / 1000) * 8) % n;      /* ~8 fps */
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, idx * fw, 0, fw, fh, 0, 0, cv.width, cv.height);
        spriteRAF = requestAnimationFrame(frame);
      }
      spriteRAF = requestAnimationFrame(frame);
    };
    img.src = spr.url;
  }

  /* putla tap: asli character texture editor me bhejo -> background par dikhega */
  function pickPutla() {
    var a = null;
    for (var k = 0; k < ANIMS.length; k++) if (ANIMS[k].id === 'idle') { a = ANIMS[k]; break; }
    if (!a) a = { id: 'idle', name: 'Idle' };
    var view2 = (typeof view === 'string' && view) ? view : 'front';
    var tex = charImg || charTex;   /* selected character pehle, IDB ka purana tex baad me */
    /* Order 60: editor me character ASLI layer ban kar jata hai (timeline me uski
       apni track), background-ghost nahi. Isliye hilao.sel nahi likhte. */
    try {
      localStorage.setItem('hilao.pickChar', JSON.stringify({ id: charId || '', name: charName, src: tex || '' , anim: a.id }));
      localStorage.removeItem('hilao.sel');
    } catch (e) {}
    showToast(charName + ' editor me aa raha hai');
    var url = 'hilao.html?v=' + Date.now();   /* character pickChar se jaata hai — ghost params nahi */
    setTimeout(function () { location.href = url; }, 260);
  }

  function renderAndMount() { render(); mountMedia(); }
  document.getElementById('btnStudio').onclick = function () { location.href = studioUrl('idle'); };

  grid.addEventListener('click', function (e) {
    /* Upload button -> gallery; tick chip -> image hatao. Dono par tile select NA ho. */
    var stb = e.target.closest('.up.studio');
    if (stb) {
      e.preventDefault(); e.stopPropagation();
      location.href = studioUrl(stb.dataset.studio);
      return;
    }
    var up = e.target.closest('.up');
    if (up) {
      e.preventDefault(); e.stopPropagation();
      openPicker(up.dataset.up);
      return;
    }
    var cl = e.target.closest('.okChip');
    if (cl) {
      e.preventDefault(); e.stopPropagation();
      var id = cl.dataset.clear;
      if (poseImg[id] && poseImg[id].kind === 'video' && poseImg[id].src) {
        try { URL.revokeObjectURL(poseImg[id].src); } catch (err) {}
      }
      delete poseImg[id];
      try { localStorage.removeItem('hilao.pose.' + id); } catch (err) {}
      idbDel('vid.' + id).catch(function () {});
      renderAndMount();
      showToast(id + ' media hata diya');
      return;
    }
    var t = e.target.closest('.tile'); if (!t) return;
    picked = t.dataset.anim;
    var a = ANIMS.filter(function (x) { return x.id === picked; })[0];
    if (!a) return;
    useBtn.disabled = false;
    useBtn.textContent = 'Use “' + a.name + '” →';
    renderAndMount();
    goEditor(a);                 /* save + turant editor par */
  });

  document.getElementById('viewTabs').addEventListener('click', function (e) {
    var t = e.target.closest('.tab'); if (!t) return;
    view = t.dataset.view;
    [].forEach.call(this.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b === t); });
    renderAndMount();
  });

  search.addEventListener('input', render);

  useBtn.addEventListener('click', function () {
    if (!picked) return;
    var a = ANIMS.filter(function (x) { return x.id === picked; })[0];
    if (!a) return;
    saveSelection(a);
    showToast(a.name + ' select · editor khol raha hai');
    var back = 'hilao.html?anim=' + encodeURIComponent(picked) +
               (charId ? '&char=' + encodeURIComponent(charId) : '') +
               '&view=' + encodeURIComponent(view);
    setTimeout(function () { location.href = back; }, 260);
  });

  /* ---------- back / close ---------- */
  function goBack() {
    try {
      if (document.referrer && document.referrer.indexOf(location.host) >= 0 && history.length > 1) {
        history.back(); return;
      }
    } catch (e) {}
    location.href = 'hilao.html';
  }
  document.getElementById('btnBack').addEventListener('click', goBack);
  var br = document.getElementById('btnBackRow'); if (br) br.addEventListener('click', goBack);
  document.getElementById('btnClose').addEventListener('click', goBack);
  document.getElementById('btnSettings').addEventListener('click', function () {
    showToast('Settings · jald aayega');
  });

  /* keyboard access */
  grid.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest('.up, .okChip, .tile'); if (!el) return;
    e.preventDefault(); el.click();
  });

  renderAndMount();
  loadCharTex();
  loadStudioDone();
})();
</script>
