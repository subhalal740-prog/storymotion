<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<title>Characters · Animations</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0f1113;color:#e8e8ec;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

  /* ---------- top bar ---------- */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(15,17,19,.94);
    backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
  .ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#cfd3d8;cursor:pointer}
  .ic:active{background:rgba(255,255,255,.12)}
  .ic svg{width:17px;height:17px}
  .top h1{flex:1;font-size:21px;font-weight:800;letter-spacing:-.4px;margin:0}
  .top .right{display:flex;gap:8px}

  /* ---------- selected character row ---------- */
  .wrap{padding:14px}
  .selRow{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:12px 14px}
  .selRow .thumb{width:52px;height:64px;flex:0 0 52px;border-radius:10px;background:rgba(255,255,255,.05);
    display:grid;place-items:center;overflow:hidden}
  .selRow .thumb img{width:100%;height:100%;object-fit:contain}
  .selRow .nm{flex:1;min-width:0}
  .selRow .nm b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selRow .nm small{display:block;font-size:10.5px;color:#8b929b;margin-top:3px;letter-spacing:.4px}
  .badgeSel{font-size:11.5px;font-weight:800;padding:7px 13px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,#7c5cff,#ff6ba8);box-shadow:0 6px 18px -8px rgba(124,92,255,.9)}

  /* ---------- search ---------- */
  .search{display:flex;align-items:center;gap:10px;margin:14px 0 12px;padding:13px 15px;border-radius:14px;
    background:#181b1f;border:1px solid rgba(255,255,255,.09);color:#8b929b;font-size:14px}
  .search svg{width:17px;height:17px;flex:0 0 17px}
  .search input{flex:1;background:transparent;border:0;outline:0;color:#e8e8ec;font:inherit;font-size:14px}
  .search input::placeholder{color:#7c848d}

  /* ---------- view tabs ---------- */
  .tabs{display:flex;gap:9px;margin-bottom:16px}
  .tab{flex:0 0 auto;padding:11px 17px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.7px;
    background:#181b1f;border:1px solid rgba(255,255,255,.09);color:#a9b1ba;cursor:pointer}
  .tab.on{background:#f2f3f5;border-color:#f2f3f5;color:#111316}
  .tab:active{transform:scale(.97)}

  /* ---------- animation grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;border-radius:16px;background:#181b1f;border:1px solid rgba(255,255,255,.08);
    padding:10px 12px 12px;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s}
  .tile:active{transform:scale(.985)}
  .tile.on{border-color:#4d8dff;box-shadow:0 0 0 1px #4d8dff,0 12px 30px -18px rgba(77,141,255,.9)}
  .tile .art{height:150px;display:grid;place-items:center}
  .tile .art svg{height:100%;width:auto}
  .tile .lb{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12.5px;font-weight:700;color:#dfe3e8;letter-spacing:-.1px}
  .tile .lb .pill{font-size:8.5px;font-weight:800;letter-spacing:.8px;padding:4px 7px;border-radius:999px;
    color:#9aa3ad;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
  .tile.on .lb .pill{color:#9fc4ff;border-color:rgba(77,141,255,.45);background:rgba(77,141,255,.14)}

  /* ---------- per-card Upload (v1) ---------- */
  .tile .up{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:6px 9px 6px 7px;
    border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);
    color:#cfd3d8;font:800 10px/1 inherit;letter-spacing:.4px;cursor:pointer;
    white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .tile .up svg{width:12px;height:12px;flex:0 0 12px}
  .tile .up:active{background:rgba(255,255,255,.15)}
  .tile .up.done{color:#8af2b4;border-color:rgba(34,224,125,.42);background:rgba(34,224,125,.13)}
  .tile .art img{display:block;width:100%;height:150px;object-fit:contain;border-radius:8px}
  .tile .art video{display:block;width:100%;height:150px;object-fit:contain;border-radius:8px;background:transparent}
  .tile .lb .pill.vid{color:#ffd166;border-color:rgba(255,209,102,.45);background:rgba(255,209,102,.12)}
  .tile .okChip{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:999px;
    display:grid;place-items:center;background:rgba(34,224,125,.18);border:1px solid rgba(34,224,125,.5);
    color:#7bf0ae;cursor:pointer}
  .tile .okChip svg{width:11px;height:11px}
  .empty{grid-column:1/-1;text-align:center;color:#7c848d;font-size:13px;padding:30px 10px}

  /* ---------- sticky CTA ---------- */
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(15,17,19,.35),rgba(15,17,19,.97) 42%)}
  .cta button{width:100%;padding:17px;border:0;border-radius:16px;font:800 15px/1 inherit;font-family:inherit;
    color:#fff;background:linear-gradient(135deg,#3b82f6,#2f6df6);letter-spacing:.2px;cursor:pointer;
    box-shadow:0 16px 34px -16px rgba(59,130,246,.95)}
  .cta button:disabled{color:#8f97a1;background:#242a31;box-shadow:none;cursor:not-allowed}
  .cta button:not(:disabled):active{transform:translateY(1px)}

  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:#22282f;border:1px solid rgba(255,255,255,.12);color:#e8e8ec;font-size:12.5px;font-weight:700;
    padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:40}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="top">
  <button class="ic" id="btnBack" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1>Characters</h1>
  <div class="right">
    <button class="ic" id="btnSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.05A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.05A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.05A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.05a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.05a1.7 1.7 0 0 0-1.55 1z"/></svg>
    </button>
    <button class="ic" id="btnClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<div class="wrap">
  <div class="selRow">
    <div class="thumb" id="selThumb"></div>
    <div class="nm"><b id="selName">My character</b><small id="selMeta">Selected</small></div>
    <span class="badgeSel">Selected</span>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <input id="animSearch" placeholder="Search Animations" aria-label="Search animations">
  </div>

  <div class="tabs" id="viewTabs">
    <button class="tab on" data-view="front">FRONT</button>
    <button class="tab" data-view="q34f">3/4 FRONT</button>
    <button class="tab" data-view="q34b">3/4 BACK</button>
  </div>

  <div class="grid" id="animGrid"></div>
</div>

<input type="file" id="poseFile" accept="image/*,video/*" hidden>
<div class="cta"><button id="btnUse" disabled>Use animation</button></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------- query params (Hilao Studio se aata hai) ---------- */
  var q = new URLSearchParams(location.search);
  var charName = (q.get('name') || 'My character').trim();
  var charImg  = q.get('img') || '';
  var charId   = q.get('id') || '';
  document.getElementById('selName').textContent = charName;
  document.getElementById('selMeta').textContent = 'Selected · ' + (q.get('cat') || 'Desi');
  document.title = charName + ' · Animations';
  if (charImg) {
    var im = new Image(); im.alt = charName; im.src = charImg;
    document.getElementById('selThumb').appendChild(im);
  } else {
    document.getElementById('selThumb').innerHTML = puppet({}, 'front', 44);
  }

  /* ---------- puppet silhouette generator ----------
     Har animation = limb angles ka set. Ek hi generator se saare
     tiles bante hain, isliye look consistent rehta hai.            */
  function seg(x1, y1, len, ang, w, col) {
    var rad = ang * Math.PI / 180;
    var x2 = x1 + Math.sin(rad) * len, y2 = y1 + Math.cos(rad) * len;
    return {
      svg: '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
           '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>',
      x: x2, y: y2
    };
  }
  /* limb with optional knee/elbow bend (2 segments) */
  function limb(x1, y1, len, ang, w, col, bend) {
    var a = seg(x1, y1, len * (bend === undefined ? 1 : 0.52), ang, w, col);
    if (bend === undefined) return a.svg;
    var b = seg(a.x, a.y, len * 0.52, ang + bend, w, col);
    return a.svg + b.svg;
  }

  /* ---------- puppet ----------
     Sar / gardan / torso / kandhe / koolhe — sab anatomical anchors par. */
  function puppet(p, view, size) {
    var col = '#f3f4f6';
    var skew = view === 'q34f' ? 'skewY(-5) scale(0.88,1)'
             : view === 'q34b' ? 'skewY(5) scale(0.88,1)' : '';
    var g = '<g' + (skew ? ' transform="' + skew + '"' : '') + '>';

    var armA  = p.armA === undefined ? 9 : p.armA;
    var armB  = p.armB === undefined ? -armA : p.armB;
    var legA  = p.legA === undefined ? (p.legs || 4) : p.legA;
    var legB  = p.legB === undefined ? -legA : p.legB;
    var bob   = p.bob || 0;             /* jump / lift */
    var kneeA = p.kneeA, kneeB = p.kneeB;

    /* LEGS (koolha 92 / 108, y 110) */
    g += limb(92, 110, 54, legA, 11, col, kneeA);
    g += limb(108, 110, 54, legB, 11, col, kneeB);

    /* ARMS (kandha 83 / 117, y 60) */
    g += limb(80, 60, 48, armA, 9.5, col, p.elbowA);
    g += limb(120, 60, 48, armB, 9.5, col, p.elbowB);

    /* TORSO */
    g += '<path d="M83 54 q17 -8 34 0 l0 50 q-17 8 -34 0 z" fill="' + col + '"/>';
    /* NECK + HEAD */
    g += '<rect x="95" y="42" width="10" height="12" rx="4" fill="' + col + '"/>';
    g += '<circle cx="100" cy="30" r="17" fill="' + col + '"/>';
    g += '</g>';
    return '<svg viewBox="0 0 200 200" style="height:' + (size || 150) + 'px' +
           (bob ? ';transform:translateY(' + bob + 'px)' : '') + '" aria-hidden="true">' + g + '</svg>';
  }

  var ANIMS = [
    /* built-in VIDEO action (AI frames se bana, repo me anim/chai-animation.mp4) */
    { id: 'chai',    name: 'Chai Action',
      video: 'anim/chai-animation.webm', video2: 'anim/chai-animation.mp4' },
    { id: 'idle',    name: 'Idle',     pose: { armA: 12, armB: -12,  legA: 4 } },
    { id: 'walk',    name: 'Walk',     pose: { armA: 26, armB: -26, legA: 17, kneeA: 12 } },
    { id: 'talking', name: 'Talking',  pose: { armA: 62, armB: -12, elbowA: -48, legA: 4 } },
    { id: 'sitting', name: 'Sitting',  pose: { armA: 16, armB: -16, legA: 78, legB: -70, kneeA: -72, kneeB: 72 } },
    { id: 'wave',    name: 'Wave',     pose: { armA: 158, armB: -12, elbowA: -20, legA: 4 } },
    { id: 'run',     name: 'Run',      pose: { armA: 52, armB: -52, legA: 34, kneeA: 26, kneeB: -22 } },
    { id: 'jump',    name: 'Jump',     pose: { armA: 152, armB: -152, legA: 20, legB: -20, kneeA: 24, kneeB: -24, bob: -6 } },
    { id: 'dance',   name: 'Dance',    pose: { armA: 108, armB: -44, elbowA: -30, legA: 22, kneeA: 14 } },
    { id: 'point',   name: 'Point',    pose: { armA: 88, armB: -8, legA: 4 } },
    { id: 'think',   name: 'Think',    pose: { armA: 44, armB: -10, elbowA: -76, legA: 3 } },
    { id: 'sit_floor',name: 'Sit Down',pose: { armA: 30, armB: -30, legA: 84, legB: -84, kneeA: -66, kneeB: 66 } },
    { id: 'explain', name: 'Explain',  pose: { armA: 70, armB: -34, elbowA: -40, elbowB: 18, legA: 10 } }
  ];


  /* ---------- per-card UPLOAD (gallery se image) ----------
     Idle aur Walk cards par chhota Upload button. Tap -> gallery/file picker khulta hai,
     image chhoti (max 480px) karke localStorage me save hoti hai aur card ka artwork
     ban jaati hai. Tap-only, dummy nahi: image turant card me dikhti hai + reload par bhi rehti hai. */
  var UPLOADABLE = { idle: 1, walk: 1 };
  var poseImg = {};
  try {
    Object.keys(UPLOADABLE).forEach(function (k) {
      var v = localStorage.getItem('hilao.pose.' + k);
      if (v) poseImg[k] = { kind: 'image', src: v };
    });
  } catch (e) {}
  var pendingAnim = null;
  var poseFile = document.getElementById('poseFile');

  /* ---------- IndexedDB (video blobs ke liye — localStorage me video fit nahi hoti) ---------- */
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('hilao-pose', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('blobs'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbPut(k, v) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('blobs', 'readwrite');
        t.objectStore('blobs').put(v, k);
        t.oncomplete = function () { res(1); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function idbGet(k) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('blobs', 'readonly'), rq = t.objectStore('blobs').get(k);
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function idbDel(k) {
    return idb().then(function (db) {
      return new Promise(function (res) {
        var t = db.transaction('blobs', 'readwrite');
        t.objectStore('blobs').delete(k);
        t.oncomplete = function () { res(1); };
      });
    });
  }
  /* page khulte hi saved videos wapas laao */
  (function restoreVideos() {
    Object.keys(UPLOADABLE).forEach(function (k) {
      idbGet('vid.' + k).then(function (blob) {
        if (blob) { poseImg[k] = { kind: 'video', src: URL.createObjectURL(blob) }; render(); }
      }).catch(function () {});
    });
  })();

  var ICO_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
               '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>';
  var ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function openPicker(anim) {
    pendingAnim = anim;
    try { poseFile.value = ''; } catch (e) {}
    poseFile.click();
  }

  /* gallery image -> max 480px -> dataURL (storage bachane ke liye) */
  function shrink(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var MAX = 480;
        var k = Math.min(1, MAX / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.imageSmoothingQuality = 'high';
        cx.drawImage(im, 0, 0, w, h);
        var out = '';
        try { out = cv.toDataURL('image/webp', 0.85); } catch (e) {}
        if (!out || out.indexOf('data:image/webp') !== 0) {
          try { out = cv.toDataURL('image/png'); } catch (e) { out = ''; }
        }
        cb(out || '');
      };
      im.onerror = function () { cb(''); };
      im.src = fr.result;
    };
    fr.onerror = function () { cb(''); };
    fr.readAsDataURL(file);
  }

  poseFile.addEventListener('change', function () {
    var f = poseFile.files && poseFile.files[0];
    if (!f || !pendingAnim) return;
    var anim = pendingAnim; pendingAnim = null;
    var nm = (ANIMS.filter(function (x) { return x.id === anim; })[0] || {}).name || anim;

    /* VIDEO: seedha blob IDB me (localStorage me nahi) */
    if ((f.type || '').indexOf('video') === 0) {
      if (f.size > 24 * 1024 * 1024) { showToast('Video 24 MB se badi hai — chhoti clip lo'); return; }
      idbPut('vid.' + anim, f).then(function () {
        poseImg[anim] = { kind: 'video', src: URL.createObjectURL(f) };
        try { localStorage.removeItem('hilao.pose.' + anim); } catch (e) {}
        render();
        showToast(nm + ' video set · gallery se aa gayi');
      }).catch(function () { showToast('Video save nahi hui — dobara try karo'); });
      return;
    }

    shrink(f, function (data) {
      if (!data) { showToast('Image padhi nahi ja saki — doosri try karo'); return; }
      idbDel('vid.' + anim).catch(function () {});
      poseImg[anim] = { kind: 'image', src: data };
      try { localStorage.setItem('hilao.pose.' + anim, data); } catch (e) {}
      render();
      var a = ANIMS.filter(function (x) { return x.id === anim; })[0];
      showToast((a ? a.name : anim) + ' image set · gallery se aa gayi');
    });
  });

  var view = 'front';
  var picked = null;
  var grid = document.getElementById('animGrid');
  var useBtn = document.getElementById('btnUse');
  var toast = document.getElementById('toast');
  var search = document.getElementById('animSearch');

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 1400);
  }

  function render() {
    var term = (search.value || '').toLowerCase().trim();
    var list = ANIMS.filter(function (a) { return a.name.toLowerCase().indexOf(term) >= 0; });
    if (!list.length) {
      grid.innerHTML = '<div class="empty">Koi animation nahi mili — doosra naam try karo.</div>';
      return;
    }
    grid.innerHTML = list.map(function (a) {
      var pv = poseImg[a.id];                                  /* user ka upload (image/video) */
      var vidSrc = pv && pv.kind === 'video' ? pv.src : (a.video || '');   /* built-in video bhi */
      var hasVid = !!vidSrc;
      var art = hasVid
        ? '<video autoplay muted loop playsinline preload="auto" webkit-playsinline>' +
          (a.video && !(pv && pv.kind === 'video')
            ? '<source src="' + a.video + '" type="video/webm"><source src="' + (a.video2 || '') + '" type="video/mp4">'
            : '<source src="' + vidSrc + '">') +
          '</video>'
        : (pv ? '<img src="' + pv.src + '" alt="' + a.name + ' uploaded image">' : puppet(a.pose, view));
      var up = UPLOADABLE[a.id]
        ? '<button class="up' + ((pv || hasVid) ? ' done' : '') + '" data-up="' + a.id + '" type="button" ' +
          'aria-label="' + ((pv || hasVid) ? 'Change ' : 'Upload ') + a.name + ' image or video from gallery">' +
          ICO_UP + '<span>' + ((pv || hasVid) ? 'Change' : 'Upload') + '</span></button>'
        : '';
      var chip = (UPLOADABLE[a.id] && pv)
        ? '<span class="okChip" data-clear="' + a.id + '" role="button" tabindex="0" aria-label="Remove uploaded ' + a.name + ' media">' + ICO_OK + '</span>'
        : '';
      var pillTxt = hasVid ? 'VIDEO' : (view === 'front' ? 'FRONT' : view === 'q34f' ? '3/4 F' : '3/4 B');
      var pillCls = hasVid ? 'pill vid' : 'pill';
      return '<div class="tile' + (picked === a.id ? ' on' : '') + '" data-anim="' + a.id + '" role="button" tabindex="0" ' +
        'aria-label="' + a.name + '">' + chip + '<div class="art">' + art + '</div>' +
        '<div class="lb"><span>' + a.name + '</span><span class="' + pillCls + '">' + pillTxt + '</span></div>' + up + '</div>';
    }).join('');
  }

  grid.addEventListener('click', function (e) {
    /* Upload button -> gallery; tick chip -> image hatao. Dono par tile select NA ho. */
    var up = e.target.closest('.up');
    if (up) {
      e.preventDefault(); e.stopPropagation();
      openPicker(up.dataset.up);
      return;
    }
    var cl = e.target.closest('.okChip');
    if (cl) {
      e.preventDefault(); e.stopPropagation();
      var id = cl.dataset.clear;
      if (poseImg[id] && poseImg[id].kind === 'video' && poseImg[id].src) {
        try { URL.revokeObjectURL(poseImg[id].src); } catch (err) {}
      }
      delete poseImg[id];
      try { localStorage.removeItem('hilao.pose.' + id); } catch (err) {}
      idbDel('vid.' + id).catch(function () {});
      render();
      showToast(id + ' media hata diya');
      return;
    }
    var t = e.target.closest('.tile'); if (!t) return;
    picked = t.dataset.anim;
    var a = ANIMS.filter(function (x) { return x.id === picked; })[0];
    useBtn.disabled = false;
    useBtn.textContent = 'Use “' + a.name + '” →';
    render();
  });

  document.getElementById('viewTabs').addEventListener('click', function (e) {
    var t = e.target.closest('.tab'); if (!t) return;
    view = t.dataset.view;
    [].forEach.call(this.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b === t); });
    render();
  });

  search.addEventListener('input', render);

  useBtn.addEventListener('click', function () {
    if (!picked) return;
    var a = ANIMS.filter(function (x) { return x.id === picked; })[0];
    try {
      localStorage.setItem('hilao.anim', picked);
      localStorage.setItem('hilao.char', charName);
    } catch (err) {}
    showToast(a.name + ' selected');
    var back = 'hilao.html?anim=' + encodeURIComponent(picked) +
               (charId ? '&char=' + encodeURIComponent(charId) : '') +
               '&view=' + encodeURIComponent(view);
    setTimeout(function () { location.href = back; }, 260);
  });

  /* ---------- back / close ---------- */
  function goBack() {
    try {
      if (document.referrer && document.referrer.indexOf(location.host) >= 0 && history.length > 1) {
        history.back(); return;
      }
    } catch (e) {}
    location.href = 'hilao.html';
  }
  document.getElementById('btnBack').addEventListener('click', goBack);
  document.getElementById('btnClose').addEventListener('click', goBack);
  document.getElementById('btnSettings').addEventListener('click', function () {
    showToast('Settings · jald aayega');
  });

  /* keyboard access */
  grid.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest('.up, .okChip, .tile'); if (!el) return;
    e.preventDefault(); el.click();
  });

  render();
})();
</script>
</body>
</html>
