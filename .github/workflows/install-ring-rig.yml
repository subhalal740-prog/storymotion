name: Ring Rig Auto Update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-ring-rig.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Ring Rig
        run: |
          python3 -c 'import json,hashlib,re,urllib.request; from pathlib import Path; root="https://drive.google.com/uc?export=download&id="; m=json.load(urllib.request.urlopen(root+"15Ki6VNm4fU-1mcdTf6pGOw1igtO4SDHN",timeout=30)); assert re.fullmatch("[A-Za-z0-9_-]{10,100}",m["file_id"]); b=urllib.request.urlopen(root+m["file_id"],timeout=30).read(); assert 100000<len(b)<5000000 and hashlib.sha256(b).hexdigest()==m["sha256"] and b"headBob" in b and b"headNod" in b; Path("Ring_Rig_15_Parts.html").write_bytes(b)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ring_Rig_15_Parts.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Ring Rig"
            git push origin HEAD:main
          fi
