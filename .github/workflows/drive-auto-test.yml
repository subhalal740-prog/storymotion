name: Drive Auto Test
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only the test file
        run: |
          curl -fsSL 'https://drive.google.com/uc?export=download&id=1tGxlRceYSSj9s9vGI0vZrxJlJvLGczcJ' -o /tmp/marker.txt
          grep -Fx 'Test ID: storymotion-bridge-20261112-v1' /tmp/marker.txt
          cp /tmp/marker.txt storymotion-drive-bridge-proof.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storymotion-drive-bridge-proof.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update Drive test'
            git push
          fi
